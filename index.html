    $('adPAd').onchange=e=>e.target.value.trim()&&yaz({project:e.target.value.trim()});
    $('adHedef').onclick=()=>dlHedefDuzenle();
    $('adYeni').onclick=()=>dlYeniProje();
    ic.querySelectorAll('[data-gec]').forEach(b=>b.onclick=async()=>{ await dl('proje_gec',{id:b.dataset.gec},{cizme:true}); if(DL.mod==='devlog') dlCiz(); ayarBolumuCiz(); });
    ic.querySelectorAll('[data-sil]').forEach(b=>b.onclick=async()=>{
      const ad=DL.s.projeler.find(x=>x[0]===b.dataset.sil)[1];
      if(b.dataset.onay){ await dl('proje_sil',{id:b.dataset.sil},{cizme:true}); if(DL.mod==='devlog') dlCiz(); ayarBolumuCiz(); return; }
      b.dataset.onay='1'; b.textContent='Emin misin? “'+ad+'” tamamen silinir'; });
  } else if(ayarBolumu==='dl_notlar'){
    const ai=p.ai;
    h+='<div class="a-aciklama">'+L('Notlarını karışık yazınca Devlog her satırı anahtar kelimelere bakarak bu kategorilere ayırır. Satırın başına “## Kategori adı” yazarak elle de seçebilirsin.','When writing raw notes, Devlog sorts each line into these categories by keyword. You can also prefix a line with "## Category".')+'</div>'+
       '<div class="a-satir dikey"><div class="a-baslik">'+L('Kategoriler','Categories')+'</div>'+p.categories.map(c=>'<div class="dl-kategori-satir"><i style="background:'+c.color+'"></i><span class="ad">'+dlK(c.name)+'</span>'+
         '<span class="s">'+(DL.sabit.varsayilan_kategoriler.includes(c.name)?L('hazır','default'):L('senin','custom'))+'</span>'+(DL.sabit.varsayilan_kategoriler.includes(c.name)?'':'<button class="a-dugme tehlike" data-ksil="'+dlK(c.name)+'">'+L('Kaldır','Remove')+'</button>')+'</div>').join('')+
       '<div class="hafiza-ekle" style="display:flex;gap:8px;margin-top:10px"><input id="adKat" class="a-girdi" placeholder="'+L('Yeni kategori: ör. Çok Oyunculu','New category: e.g. Multiplayer')+'"><button class="a-dugme" id="adKatEkle">'+L('Ekle','Add')+'</button></div></div>'+
       '<div class="a-alt-baslik">'+L('Yapay zekâ (Ollama)','AI (Ollama)')+'</div><div class="a-aciklama">'+L('“Yapay zekâ ile düzenle”, özet ve TR/EN çeviri bilgisayarındaki Ollama ile çalışır; internet ve ücret gerekmez.','AI organize, summary, and translation run locally via Ollama with no API cost.')+'</div>'+
       ayarSatiri(L('Ollama adresi','Ollama URL'),L('Genelde değiştirmen gerekmez.','Usually does not need to be changed.'),'<input type="text" id="adAiU" class="a-girdi" value="'+dlK(ai.url)+'">')+
       ayarSatiri(L('Model','Model'),L('Ör. qwen2.5:7b, llama3.1:8b.','E.g. qwen2.5:7b, llama3.1:8b.'),'<input type="text" id="adAiM" class="a-girdi" list="adAiL" value="'+dlK(ai.model)+'"><datalist id="adAiL"></datalist>')+
       ayarSatiri(L('Düzenlenen notların dili','Output language'),L('“Aynen” = yazdığın dilde bırakır.','Keep = keeps your original language.'),'<select id="adAiD" class="a-secim">'+[['Aynen',L('Aynen','Keep')],['Türkçe','Türkçe'],['English','English']].map(([v,lbl])=>'<option value="'+v+'"'+(ai.lang===v?' selected':'')+'>'+lbl+'</option>').join('')+'</select>')+
       ayarSatiri(L('Bağlantıyı dene','Test connection'),'<span id="adAiS">'+L('Ollama çalışıyor mu, model yüklü mü?','Check if Ollama is running and the model is installed.')+'</span>','<button class="a-dugme" id="adAiT">'+L('Dene','Test')+'</button>');
    ic.innerHTML=h;
    ic.querySelectorAll('[data-ksil]').forEach(b=>b.onclick=async()=>{ await dl('kategori_sil',{ad:b.dataset.ksil},{cizme:true}); ayarBolumuCiz(); });
    const ekle=async()=>{ const v=$('adKat').value.trim(); if(!v) return; if(await dl('kategori_ekle',{ad:v},{cizme:true})) ayarBolumuCiz(); };
    $('adKatEkle').onclick=ekle; $('adKat').onkeydown=e=>{ if(e.key==='Enter') ekle(); };
    const aiYaz=()=>yaz({ai:Object.assign({},p.ai,{url:$('adAiU').value.trim()||'http://localhost:11434',model:$('adAiM').value.trim(),lang:$('adAiD').value})});
    ['adAiU','adAiM','adAiD'].forEach(i=>$(i).onchange=aiYaz);
    $('adAiT').onclick=async()=>{ $('adAiS').textContent='Deneniyor…'; const r=await dl('ollama_test',{},{cizme:true,sessiz:true});
      if(!r){ $('adAiS').innerHTML='<span class="hata-yazi">Ollama\'ya ulaşılamadı. Ollama açık mı? (ollama.com)</span>'; return; }
      $('adAiL').innerHTML=r.modeller.map(m=>'<option value="'+dlK(m)+'">').join('');
      $('adAiS').innerHTML=r.hazir?'<span class="rozet uygun">Hazır</span> '+r.modeller.length+' model yüklü':'<span class="rozet yavas">Model yok</span> “'+dlK(p.ai.model)+'” yüklü değil. Terminalde: <code>ollama pull '+dlK(p.ai.model)+'</code>'+(r.modeller.length?' · Yüklü: '+r.modeller.slice(0,5).map(dlK).join(', '):''); };
  } else if(ayarBolumu==='dl_discord'){
    const w=p.discord_webhook||'', b=DL.s.bot;
    h+='<div class="a-alt-baslik" style="margin-top:4px">Bot</div>';
    if(!b.var) h+='<div class="a-aciklama">'+L('Bot, senin adına Discord\'da mesaj atan bir hesaptır. Focus açıkken çevrimiçi görünür; gönderileri ve sürüm notlarını istediğin kanala atar.','The bot posts release notes and updates to your Discord server and handles slash commands while Focus is open.')+'</div>'+
      '<ol class="dl-adim"><li><a class="a-link" onclick="linkAc(\'https://discord.com/developers/applications\')">Discord Developer Portal</a> → <b>New Application</b>.</li>'+
      '<li><b>Bot</b> → <b>Reset Token</b> → '+L('çıkan token\'ı kopyala.','copy the bot token.')+'</li>'+
      '<li>'+L('Aşağıya yapıştır, “Bağla”ya bas.','Paste it below and click Connect.')+'</li></ol>'+
      '<div style="display:flex;gap:8px"><input type="password" id="adBt" class="a-girdi" placeholder="'+L('Bot token\'ı','Bot token')+'" autocomplete="off"><button class="a-dugme birincil" id="adBtOk">'+L('Bağla','Connect')+'</button></div>';
    else h+=dlBotSatiri(true)+
      ayarSatiri(L('Focus açıkken botu çalıştır','Run bot while Focus is open'),L('Kapalıysa bot çevrimdışı görünür ve komutlara cevap vermez.','When off, the bot appears offline and stops answering commands.'),anahtarDugme('adBA',b.aktif))+
      ayarSatiri(L('Botun durum yazısı','Bot status text'),L('Botun adının altında görünür.','Shown under the bot name.'),'<input type="text" id="adBD" class="a-girdi" maxlength="128" value="'+dlK(b.durum_metni)+'" placeholder="'+dlK(p.project)+'">')+
      ayarSatiri(L('Botu sunucuna ekle','Invite bot to server'),L('Komutlar görünmüyorsa botu bu linkle bir kez daha ekle.','Use this link to add the bot to your Discord server.'),'<button class="a-dugme" id="adBI">'+L('Davet linkini aç','Open invite link')+'</button>')+
      ayarSatiri('Token','<span class="kucuk-yol">'+dlK(b.maske)+'</span>','<button class="a-dugme" id="adBT">'+L('Değiştir','Change')+'</button> <button class="a-dugme tehlike" id="adBX">'+L('Kaldır','Remove')+'</button>')+
      '<div class="a-alt-baslik">'+L('Sürüm notları','Release notes')+'</div>'+
      ayarSatiri(L('Varsayılan kanal','Default channel'),b.kanal?(b.kanal.duyuru?'📢 ':'#')+dlK(b.kanal.ad)+' · '+dlK(b.kanal.sunucu):L('Sürüm notu paylaşırken önce bu kanal seçili gelir.','Pre-selected channel when sharing release notes.'),'<button class="a-dugme" id="adBK">'+(b.kanal?L('Değiştir','Change'):L('Seç','Select'))+'</button>')+
      ayarSatiri(L('Duyuru kanallarında yayınla','Publish in announcement channels'),L('Duyuru (📢) kanalına gönderilenler, kanalı takip eden diğer sunuculara da gider.','Cross-posts messages sent to announcement channels.'),anahtarDugme('adBY',b.yayinla))+
      '<div class="a-alt-baslik">'+L('Fikir kanalları','Idea channels')+'</div><div class="a-aciklama">'+L('Bu kanallara yazılan her mesaj Fikirler\'e eklenir.','Messages posted in these channels are saved to Ideas.')+'</div>'+
      (b.icerik_uyari?'<div class="dl-uyari">'+L('Developer Portal → Bot → Message Content Intent\'i aç ve kaydet.','Enable Message Content Intent in Discord Developer Portal → Bot.')+'</div>':'')+
      (b.fikir_kanallari||[]).map(k=>'<div class="dl-kategori-satir"><span style="color:var(--soluk)">#</span><span class="ad">'+dlK(k.ad)+' <span class="s">· '+dlK(k.sunucu)+'</span>'+
        (k.hata?'<div class="hata-yazi" style="font-size:12px">'+dlK(k.hata)+'</div>':'')+'</span><button class="a-dugme tehlike" data-fsil="'+k.id+'">'+L('Kaldır','Remove')+'</button></div>').join('')+
      '<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="a-dugme" id="adFE">'+L('+ Kanal ekle','+ Add channel')+'</button>'+
      '<button class="a-dugme" id="adFS">'+L('Şimdi kontrol et','Check now')+'</button></div>'+
      ayarSatiri(L('Eklenen mesaja 💡 tepkisi bırak','React with 💡 on saved ideas'),L('Yazan kişi fikrinin kaydedildiğini görür.','Lets the author know their idea was saved.'),anahtarDugme('adFT',b.tepki))+
      '<div class="a-alt-baslik">'+L('Komutlar','Commands')+'</div><div class="a-aciklama">'+L('Sunucundakiler <code>/</code> yazınca bu komutları görür.','Server members see these slash commands when typing <code>/</code>.')+'</div>'+
      (b.komut_hatasi?'<div class="hata-yazi" style="margin-top:6px">'+dlK(b.komut_hatasi)+'</div>':'')+
      b.komut_listesi.map(([k,ac])=>ayarSatiri('<code>/'+k+'</code>',dlK(ac)+(k==='buglar'||k==='gorevler'?' <span class="rozet yavas">'+L('herkes görür','public')+'</span>':''),anahtarDugme('adK_'+k,b.komutlar[k]))).join('');
    h+='<div class="a-alt-baslik">Webhook '+(b.var?L('(bot yerine, isteğe bağlı)','(optional fallback)'):L('(bot olmadan, daha basit)','(simpler, no bot needed)'))+'</div>'+

    ic.innerHTML=h;
    const botYaz=async(d,mesaj)=>{ const r=await dl('bot_ayar',d,{cizme:true}); if(r){ if(mesaj) tost(mesaj); if(DL.mod==='devlog') dlCiz(); ayarBolumuCiz(); } return r; };
    if(!b.var){

    } else {
      $('adBA').onchange=e=>botYaz({aktif:e.target.checked},e.target.checked?'Bot başlatılıyor…':'Bot durduruldu');

    h+='<div class="a-alt-baslik">'+L('Sosyal Medya (n8n Webhook)','Social Media (n8n Webhook)')+'</div>'+
       '<div class="a-satir dikey"><div class="a-baslik">n8n Webhook URL '+(sa.webhook?.bagli?'<span class="rozet uygun">'+L('Bağlı','Connected')+'</span>':'')+'</div>'+
       '<div class="a-aciklama">'+L('İçerik Takvimi veya Görsel Oluştur ekranından seçtiğin platformlara (X, Instagram, Reddit, YouTube, TikTok) n8n üzerinden paylaşır.','Posts to your selected platforms via n8n from Content Calendar or Generate Image.')+'</div>'+

// Bot durumu birkaç saniyede bir yoklanır (bağlanırken / bağlantı koptuğunda değişir)
let dlYoklama=0;
setInterval(async()=>{
  if(!DL.s?.bot?.var||document.hidden) return;
  // Her şey yolundaysa daha seyrek yokla (yeni Discord fikirleri için ~16 sn'de bir)
  const sakin=DL.s.bot.durum==='cevrimici'&&!(DL.mod==='devlog'&&DL.sayfa==='discord')&&$('perde').classList.contains('gizle');
  if(sakin&&(++dlYoklama%4)) return;
  let r; try{ r=await (await fetch('/dl/api',{method:'POST',body:JSON.stringify({islem:'bot_durum'})})).json(); }catch(e){ return; }
  if(!r.bot) return;
  const eski=DL.s.bot; DL.s.bot=r.bot;
  if(r.bot.fikir_sayac>(eski.fikir_sayac||0)){   // Discord kanallarından yeni fikir geldi
    const n=r.bot.fikir_sayac-(eski.fikir_sayac||0);
    tost('💡 Discord\'dan '+n+' yeni fikir eklendi');
    await dl('durum',{},{sessiz:true,cizme:true});
    if(DL.mod==='devlog'&&['ideas','dashboard','timeline'].includes(DL.sayfa)&&$('perde').classList.contains('gizle')) dlCiz(); else if(DL.mod==='devlog') dlYanCiz();
    return;
  }
  if(JSON.stringify(eski)===JSON.stringify(r.bot)) return;
  dlYanCiz();
  const k=$('dlBotKart'); if(k) k.outerHTML=dlBotSatiri(k.classList.contains('a-satir'));
  // planlı bir gönderi gittiyse Discord sayfasının listelerini tazele (yazı kutusuna dokunmadan)
  if(DL.sayfa==='discord'&&JSON.stringify(eski.planli)!==JSON.stringify(r.bot.planli)) dl('durum',{},{sessiz:true});
},4000);

function dlSunucuCiz(){
  const b=DL.s.bot, s=dlP().discord_sunucu; if(!b.var) return '';
  if(!s) return '<div class="dl-dc"><div class="ust"><span>DISCORD · SUNUCU</span><span>yükleniyor…</span></div></div>';
  const g=dlP().discord_gecmis||{}, gun=Object.keys(g).sort().slice(-30), uyeler=gun.map(x=>g[x][0]||0);
  const ilk=uyeler[0]??s.uye, fark=(s.uye||0)-(ilk||0);
  const fk=(b.fikir_kanallari||[]), bas=dlHaftaBasi();
  const dcFikir=dlP().ideas.filter(i=>i.discord_id), haftalik=dcFikir.filter(i=>{ const d=dlTarih(i.created); return d&&d>=bas; }).length;
  // Son 30 günün üye sayısı: küçük çizgi grafik
  let grafik='';
  if(uyeler.length>2&&new Set(uyeler).size>1){ const mn=Math.min(...uyeler), mx=Math.max(...uyeler), W=220, H=46;
    const nk=uyeler.map((v,i)=>[(W*i/(uyeler.length-1)).toFixed(1),(H-4-(mx===mn?H/2:(H-8)*(v-mn)/(mx-mn))).toFixed(1)]);
    grafik='<svg viewBox="0 0 '+W+' '+H+'" class="dc-grafik"><path d="M'+nk.map(n=>n.join(',')).join(' L')+' L'+W+','+H+' L0,'+H+'Z" fill="#5865F233"/><polyline points="'+nk.map(n=>n.join(',')).join(' ')+'" fill="none" stroke="#5865F2" stroke-width="2"/></svg>'; }
  const kutu=(e,d,a,click='')=>'<div class="dc-sayi"'+(click?' style="cursor:pointer" onclick="'+click+'"':'')+'><div class="e">'+e+'</div><div class="d">'+d+'</div>'+(a?'<div class="a">'+a+'</div>':'')+'</div>';
  const yeni7=s.yeni_7_gun;
  const uyeAlt=yeni7!=null
    ? '<b class="art">+'+yeni7+'</b> son 7 günde · Yönet ↗'
    : (gun.length>1?(fark>=0?'<b class="art">+'+fark+'</b>':'<b class="az">'+fark+'</b>')+' son '+gun.length+' günde · Yönet ↗':'Yönet ↗');
  return '<div class="dl-dc"><div class="ust"><span>DISCORD · SUNUCU</span><span>güncellendi: '+dlK((s.fetched||'').slice(11,16))+' · <a onclick="dlSunucuTazele(true)">↻</a></span></div>'+
    '<div class="govde"><div class="ikon'+(s.ikon?' resimli':'')+'">'+(s.ikon?'<img src="'+dlK(s.ikon)+'" onerror="this.parentNode.classList.remove(\'resimli\');this.replaceWith(\''+dlK((s.ad||'?')[0])+'\')">':dlK((s.ad||'?')[0]))+'</div>'+
    '<div class="bilgi"><div class="ad">'+dlK(s.ad)+'</div><div class="alt">'+(s.seviye?'Boost seviyesi '+s.seviye+' · ':'')+s.kanal+' metin, '+s.ses+' ses kanalı · '+s.rol+' rol</div></div>'+grafik+'</div>'+
    '<div class="sayilar">'+kutu('Üyeler',(s.uye??'—').toLocaleString('tr-TR'),uyeAlt,'dlUyelerAc()')+
    kutu('<i class="cv"></i>Çevrimiçi',(s.cevrimici??'—').toLocaleString('tr-TR'),s.uye?'%'+Math.round(100*(s.cevrimici||0)/s.uye)+' üye':'')+
    kutu('Boost',s.boost,s.seviye?'Seviye '+s.seviye:'')+
    kutu('Discord fikirleri',dcFikir.length,fk.length?'bu hafta '+haftalik+' · '+fk.map(k=>'#'+dlK(k.ad)).join(' '):'<a onclick="ayarlariAc(\'dl_discord\')">fikir kanalı seç</a>')+'</div></div>';
}

  let sekme='tumu', ara='', secili=new Set();
  const ciz=()=>{
    const q=ara.trim().toLowerCase();
    const liste=r.uyeler.filter(u=>{
      if(sekme==='yeni'&&(u.bot||(u.katildi||'').slice(0,10)<esik)) return false;
      if(q&&!(u.ad+' '+u.kullanici).toLowerCase().includes(q)) return false;
      return true;
    });
    const yeniSay=r.uyeler.filter(u=>!u.bot&&(u.katildi||'').slice(0,10)>=esik).length;
    const rolSec=roller.map(x=>'<option value="'+x.id+'">'+dlK(x.ad)+'</option>').join('');
    let h='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">'+
      '<button class="dl-dugme'+(sekme==='tumu'?' ana':'')+'" id="duSTum">'+L('Tüm üyeler','All members')+' ('+r.uyeler.length+')</button>'+
      '<button class="dl-dugme'+(sekme==='yeni'?' ana':'')+'" id="duSYeni">'+L('Yeni katılanlar (7 gün)','New joins (7d)')+' ('+yeniSay+')</button>'+
      '<input id="duAra" class="a-girdi" style="flex:1;min-width:150px" placeholder="'+L('Üye ara…','Search member…')+'" value="'+dlK(ara)+'"></div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border:1px solid var(--cizgi);border-radius:10px;margin-bottom:10px;background:var(--kart)">'+
      '<label style="display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;font-size:13px"><input type="checkbox" id="duHepsi"'+(liste.length&&liste.every(u=>secili.has(u.id))?' checked':'')+'> '+L('Tümünü seç','Select all')+' ('+secili.size+')</label>'+
      '<select id="duTopluRol" class="a-secim" style="flex:1;min-width:140px">'+rolSec+'</select>'+
      '<button class="dl-dugme ana" id="duTopluVer">'+L('Seçilenlere Rol Ver','Assign Role')+'</button>'+
      '<button class="dl-dugme" id="duTopluAl">'+L('Seçilenlerden Kaldır','Remove Role')+'</button></div>';
    h+='<div style="max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:6px">';
    for(const u of liste){
      const yeniMi=!u.bot&&(u.katildi||'').slice(0,10)>=esik;
      const rolEtiket=u.roller.map(rid=>{ const ro=rolMap[rid]; if(!ro) return '';
        return '<span class="rozet" style="border:1px solid '+(ro.renk||'var(--cizgi)')+';color:'+(ro.renk||'var(--yazi)')+';display:inline-flex;align-items:center;gap:4px">'+dlK(ro.ad)+
          (!ro.yonetilen?' <a style="cursor:pointer;opacity:.7" data-rkaldir="'+u.id+':'+rid+'" title="'+L('Rolü kaldır','Remove role')+'">×</a>':'')+'</span>'; }).join(' ');
      const eklenebilir=roller.filter(x=>!u.roller.includes(x.id));
      h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--cizgi);border-radius:10px">'+
        '<input type="checkbox" data-usec="'+u.id+'"'+(secili.has(u.id)?' checked':'')+'>'+
        (u.avatar?'<img src="'+dlK(u.avatar)+'" style="width:28px;height:28px;border-radius:50%;flex-shrink:0">':'<div style="width:28px;height:28px;border-radius:50%;background:var(--cizgi);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">'+dlK(u.ad[0]||'?')+'</div>')+
        '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+dlK(u.ad)+' <span class="dl-kucuk">@'+dlK(u.kullanici)+'</span>'+
          (yeniMi?'<span class="rozet uygun">'+L('Yeni','New')+'</span>':'')+(u.bot?'<span class="rozet">BOT</span>':'')+'</div>'+
          '<div class="dl-kucuk" style="margin-top:2px">'+L('Katıldı:','Joined:')+' '+dlK((u.katildi||'').slice(0,10))+'</div>'+
          (rolEtiket?'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">'+rolEtiket+'</div>':'')+'</div>'+
        (eklenebilir.length?'<select class="a-secim" style="max-width:135px;font-size:12px" data-rver="'+u.id+'"><option value="">+ '+L('Rol ver','Add role')+'</option>'+eklenebilir.map(x=>'<option value="'+x.id+'">'+dlK(x.ad)+'</option>').join('')+'</select>':'')+
        '</div>';
    }
    if(!liste.length) h+='<div class="dl-kucuk" style="padding:24px;text-align:center">'+L('Üye bulunamadı.','No members found.')+'</div>';
    h+='</div>';
    ic.innerHTML=h;
    $('duSTum').onclick=()=>{ sekme='tumu'; ciz(); };
    $('duSYeni').onclick=()=>{ sekme='yeni'; ciz(); };
    $('duAra').oninput=e=>{ const pos=e.target.selectionStart; ara=e.target.value; ciz(); const el=$('duAra'); if(el){ el.focus(); el.setSelectionRange(pos,pos); } };
    $('duHepsi').onchange=e=>{ if(e.target.checked) liste.forEach(u=>secili.add(u.id)); else liste.forEach(u=>secili.delete(u.id)); ciz(); };
    ic.querySelectorAll('[data-usec]').forEach(cb=>cb.onchange=e=>{ if(e.target.checked) secili.add(cb.dataset.usec); else secili.delete(cb.dataset.usec); ciz(); });
    const rolIslem=async(uidList,rid,ekle)=>{
      if(!uidList.length||!rid) return tost(L('Üye ve rol seç.','Select member(s) and role.'));
      const res=await dl('discord_rol_ver',{uye_idler:uidList,rol_id:rid,ekle},{cizme:true});
      if(!res) return;
      for(const u of r.uyeler) if(uidList.includes(u.id)){
        if(ekle&&!u.roller.includes(rid)) u.roller.push(rid);
        if(!ekle) u.roller=u.roller.filter(x=>x!==rid);
      }
      tost(ekle?L('Rol verildi ('+res.tamam+')','Role assigned ('+res.tamam+')'):L('Rol kaldırıldı ('+res.tamam+')','Role removed ('+res.tamam+')'));
      ciz();
    };
    $('duTopluVer').onclick=()=>rolIslem([...secili],$('duTopluRol').value,true);
    $('duTopluAl').onclick=()=>rolIslem([...secili],$('duTopluRol').value,false);
    ic.querySelectorAll('[data-rver]').forEach(sel=>sel.onchange=e=>{ if(e.target.value) rolIslem([sel.dataset.rver],e.target.value,true); });
    ic.querySelectorAll('[data-rkaldir]').forEach(a=>a.onclick=()=>{ const [uid,rid]=a.dataset.rkaldir.split(':'); rolIslem([uid],rid,false); });
  };
  ciz();
}

// ---- Bulut: başka cihazdan (telefon) gelen değişiklikleri ekrana yansıt ----
setInterval(async()=>{
  if(DL.mod!=='devlog'||!DL.s?.bulut?.aktif||document.hidden) return;
  let r; try{ r=await (await fetch('/dl/api',{method:'POST',body:JSON.stringify({islem:'bot_durum'})})).json(); }catch(e){ return; }

  const yeni=r.bulut_surum!==DL.s.bulut_surum, dur=JSON.stringify(r.bulut)!==JSON.stringify(DL.s.bulut);
  DL.s.bulut=r.bulut;
  if(yeni){ await dl('durum',{},{sessiz:true,cizme:true}); if($('perde').classList.contains('gizle')) dlCiz(); else dlYanCiz(); }

},5000);

// ---- Kanal listesi ve seçiciler ----
async function dlKanallar(zorla){
  if(DL.kanallar&&!zorla) return DL.kanallar;
  const r=await dl('bot_kanallar',{},{cizme:true,sessiz:true});
  if(r) DL.kanallar={sunucular:r.sunucular,davet:r.davet};
  return DL.kanallar;
}
function dlKanalBul(id){ for(const g of DL.kanallar?.sunucular||[]) for(const k of g.kanallar) if(k.id===id) return {id:k.id,ad:k.ad,sunucu:g.ad,sunucu_id:g.id,duyuru:k.duyuru}; return null; }
// <select>: sunuculara göre gruplanmış kanallar
function dlKanalSecimi(id,secili){
  const l=DL.kanallar?.sunucular||[];
  let h='<select class="dl-secim" id="'+id+'">';
  if(!l.length&&secili) h+='<option value="'+dlK(secili.id)+'">'+(secili.duyuru?'📢 ':'# ')+dlK(secili.ad)+'</option>';
  for(const g of l) h+='<optgroup label="'+dlK(g.ad)+'">'+g.kanallar.map(k=>'<option value="'+k.id+'"'+(secili?.id===k.id?' selected':'')+'>'+(k.duyuru?'📢 ':'# ')+dlK(k.ad)+'</option>').join('')+'</optgroup>';
  return h+'</select>';
}
// Bahsetme seçici: seçili kanalın sunucusundaki roller
function dlBahsetSecimi(id,kanal,secili){
  const g=(DL.kanallar?.sunucular||[]).find(x=>x.id===kanal?.sunucu_id);
  return '<select class="dl-secim" id="'+id+'" title="Gönderide kimden bahsedilsin (bildirim gider)"><option value="">Bildirim yok</option>'+
    '<option value="here"'+(secili==='here'?' selected':'')+'>@here (çevrimiçi olanlar)</option><option value="everyone"'+(secili==='everyone'?' selected':'')+'>@everyone (herkes)</option>'+
    (g?.roller?.length?'<optgroup label="Roller">'+g.roller.map(r=>'<option value="rol:'+r.id+'"'+(secili==='rol:'+r.id?' selected':'')+'>@'+dlK(r.ad)+'</option>').join('')+'</optgroup>':'')+'</select>';
}
const dlBahset=v=>!v?null:v.startsWith('rol:')?{tur:'rol',id:v.slice(4)}:{tur:v};

// Sürüm notlarının varsayılan kanalı (Ayarlar'dan)
async function dlKanalSec(){
  pencereAc('<h2>Sürüm notları kanalı</h2><div class="p-not">Sürüm notu paylaşırken önce bu kanal seçili gelir (bu proje için). Listede sunucun yoksa botu önce sunucuna ekle.</div><div id="dkSec" class="dl-kanal-sec"><div class="p-not" style="padding:20px 0"><span class="donen" style="display:inline-block;vertical-align:-2px"></span> Kanallar alınıyor…</div></div>'+
    '<div class="dugmeler"><button style="margin-right:auto" id="dkDavet">Botu sunucuna ekle ↗</button><button onclick="pencereKapat()">Vazgeç</button></div>');
  const r=await dlKanallar(true);
  if(!$('dkSec')) return;
  if(!r){ $('dkSec').innerHTML='<div class="hata-yazi" style="padding:10px 0">Kanallar alınamadı. Token\'ı ve internet bağlantını kontrol et.</div>'; return; }
  $('dkDavet').onclick=()=>linkAc(r.davet);
  const secili=DL.s.bot.kanal?.id;
  $('dkSec').innerHTML=r.sunucular.length?r.sunucular.map(g=>'<div class="sunucu">'+dlK(g.ad)+'</div>'+(g.kanallar.length?g.kanallar.map(k=>
      '<div class="kanal'+(k.id===secili?' secili':'')+'" data-k="'+k.id+'">'+
      '<span style="color:var(--soluk)">'+(k.duyuru?'📢':'#')+'</span>'+dlK(k.ad)+(k.duyuru?' <span class="rozet uygun">duyuru</span>':'')+'<span class="kat">'+dlK(k.kategori)+'</span></div>').join('')
      :'<div class="p-not">Bot bu sunucuda hiçbir kanalı göremiyor.</div>')).join('')
    :'<div class="dl-bos" style="padding:20px"><div class="buyuk">Bot henüz hiçbir sunucuda değil</div>“Botu sunucuna ekle”ye bas, sunucunu seç, sonra bu pencereyi yeniden aç.</div>';
  $('dkSec').querySelectorAll('.kanal').forEach(el=>el.onclick=async()=>{
    const k=dlKanalBul(el.dataset.k); pencereKapat();
    await dl('bot_kanal_sec',k,{cizme:true});
    tost('Sürüm notları kanalı: #'+k.ad); if(DL.mod==='devlog') dlCiz(); if($('aIcerik')) ayarBolumuCiz();
  });
}

// ---- Sürüm notunu Discord'a gönder (bot varsa kanal seçerek, yoksa webhook) ----
const DL_YONTEM={kapak_detay:'Görseller (kapak + detay)',kart:'Renkli kart',kapak_metin:'Kapak görseli + metin'};
async function dlDiscord(id,yontem,dil){
  const b=DL.s.bot, r=dlBul('releases',id);
  if(!b.var){
    if(!dlP().discord_webhook) return onayla('Discord bağlı değil','Discord\'a göndermek için Ayarlar > Devlog > Discord\'dan bot token\'ını (önerilen) ya da bir webhook adresi gir. Şimdi açılsın mı?','Ayarları aç').then(e=>e&&ayarlariAc('dl_discord'));
    if(!await onayla('Discord\'a gönderilsin mi?',dlV(r.version)+' sürüm notları webhook\'un bağlı olduğu kanala gönderilecek.','Gönder')) return;
    tost('Discord\'a gönderiliyor…');
    if(await dl('discord_gonder',{id,yontem,dil,tema:dlTema(),hedef:'webhook'},{cizme:true})) tost('Discord\'a gönderildi ✓');
    return;
  }
  pencereAc('<h2>'+dlK(dlV(r.version))+' Discord\'a</h2><div class="p-not">'+DL_YONTEM[yontem]+(dil?' · '+(dil==='en'?'İngilizce':'Türkçe'):'')+'</div>'+
    '<div id="dsdIc" style="margin-top:12px"><div class="p-not"><span class="donen" style="display:inline-block;vertical-align:-2px"></span> Kanallar alınıyor…</div></div>'+
    '<div class="dugmeler"><button onclick="pencereKapat()">Vazgeç</button><button class="ana" id="dsdOk" disabled>'+dlI('discord',15)+' Gönder</button></div>');
  await dlKanallar();
  if(!$('dsdIc')) return;
  let kanal=b.kanal||b.son_kanal||null;
  const ciz=()=>{
    $('dsdIc').innerHTML='<label style="margin-top:0">Kanal</label><div style="display:flex;gap:8px">'+dlKanalSecimi('dsdK',kanal)+'<button class="dl-dugme" title="Kanalları yenile" onclick="dlKanallar(true).then(()=>document.getElementById(\'dsdYen\').click())">↻</button><button id="dsdYen" class="gizle"></button></div>'+
      '<label>Bildirim</label>'+dlBahsetSecimi('dsdB',kanal,'')+
      (kanal?.duyuru?'<label class="kutucuk"><input type="checkbox" id="dsdY"'+(b.yayinla?' checked':'')+'> Takip eden sunuculara da yayınla</label>':'')+
      (b.kanal&&kanal&&kanal.id!==b.kanal.id?'<label class="kutucuk"><input type="checkbox" id="dsdV"> Bunu sürüm notlarının varsayılan kanalı yap</label>':'');
    $('dsdK').onchange=e=>{ kanal=dlKanalBul(e.target.value); ciz(); };
    $('dsdYen').onclick=ciz;
    $('dsdOk').disabled=!kanal;
  };
  kanal=kanal&&(dlKanalBul(kanal.id)||kanal); if(!kanal&&DL.kanallar?.sunucular?.[0]?.kanallar?.[0]) kanal=dlKanalBul(DL.kanallar.sunucular[0].kanallar[0].id);
  ciz();
  $('dsdOk').onclick=()=>dlBekle($('dsdOk'),' Gönderiliyor…',async()=>{
    const bahset=dlBahset($('dsdB').value), yayinla=$('dsdY')?$('dsdY').checked:null;
    if(bahset?.tur==='everyone'&&!await new Promise(c=>c(confirm('@everyone sunucudaki herkese bildirim gönderir. Emin misin?')))) return;
    if($('dsdV')?.checked) await dl('bot_kanal_sec',kanal,{cizme:true});
    const x=await dl('discord_gonder',{id,yontem,dil,tema:dlTema(),hedef:'bot',kanal,bahset,yayinla},{cizme:true});
    if(x){ pencereKapat(); tost('#'+kanal.ad+' kanalına gönderildi ✓'); if(DL.sayfa==='discord') dlSayfaCiz(); }
  });
}

     (ak.length?ak.map(([k,ac])=>'<div class="dl-liste-oge" style="cursor:default"><code class="dl-komut">/'+k+'</code><span class="ad" style="color:var(--soluk)">'+dlK(ac)+'</span></div>').join(''):'<div class="p-not">Bütün komutlar kapalı.</div>')+
     (b.komut_hatasi?'<div class="hata-yazi" style="margin-top:6px">'+dlK(b.komut_hatasi)+'</div>':'')+'</div>';
  setTimeout(dlGonderiBagla,0);

}

function dlZamanHesapla(v){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  if(v==='1') d.setHours(d.getHours()+1);
  else{ if(v==='y20') d.setDate(d.getDate()+1); else d.setDate(d.getDate()+((5-d.getDay()+7)%7||7)); d.setHours(20,0,0,0); }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function dlGonderiBagla(){
  if(!$('dgM')) return;
  const g=DL.gonderi, say=()=>{ const n=$('dgM').value.length; $('dgSay').textContent=n?n+(g.kart?' / 4000':' karakter'+(n>2000?' · '+Math.ceil(n/1900)+' mesaja bölünecek':'')):''; };
  $('dgM').oninput=()=>{ g.metin=$('dgM').value; say(); }; say();
  if($('dgB')) $('dgB').oninput=()=>g.baslik=$('dgB').value;
  if($('dgKn')) $('dgKn').onchange=e=>{ g.kanal=dlKanalBul(e.target.value); g.bahset=''; dlSayfaCiz(); };
  if($('dgBh')) $('dgBh').onchange=e=>g.bahset=e.target.value;
  $('dgK').onchange=e=>{ g.kart=e.target.checked; dlSayfaCiz(); };
  $('dgZ').onclick=()=>{ $('dgZKutu').classList.toggle('gizle'); if(!$('dgZT').value) $('dgZT').value=dlZamanHesapla('1'); };
  $('dgZT').onchange=e=>{ g.zaman=e.target.value; dlSayfaCiz(); };
  $('dgZKutu').querySelectorAll('[data-z]').forEach(x=>x.onclick=()=>{ g.zaman=x.dataset.z?dlZamanHesapla(x.dataset.z):''; dlSayfaCiz(); });
  $('dgM').onkeydown=e=>{ if(e.ctrlKey&&e.key==='Enter'){ e.preventDefault(); $('dgG').click(); } };
  $('dgG').onclick=()=>dlBekle($('dgG'),g.zaman?' Planlanıyor…':' Gönderiliyor…',async()=>{
    const bahset=dlBahset(g.bahset);
    if(bahset?.tur==='everyone'&&!confirm('@everyone sunucudaki herkese bildirim gönderir. Emin misin?')) return;
    const r=await dl('bot_gonder',{metin:g.metin,baslik:g.kart?g.baslik:'',kart:g.kart,resimler:g.resimler,kanal:g.kanal,bahset,
      yayinla:$('dgY')?$('dgY').checked:null,zaman:g.zaman||null},{cizme:true});
    if(!r) return;
    DL.gonderi={metin:'',baslik:'',kart:g.kart,resimler:[],kanal:g.kanal,bahset:'',zaman:''};
    tost(r.planlandi?'Planlandı: '+dlGunYaz(r.planlandi)+' '+r.planlandi.slice(11):'#'+g.kanal.ad+' kanalına gönderildi ✓'); dlSayfaCiz();
  });
  dlGonderiResimCiz();
}
// Bu haftanın biten görevleri, çözülen bugları ve yeni sürümlerinden bir gönderi taslağı
function dlHaftalikOzet(){
  const p=dlP(), bas=dlHaftaBasi(), bu=s=>{ const d=dlTarih(s); return d&&d>=bas; };
  const g=p.todos.filter(x=>x.status==='Bitti'&&bu(x.done_at)), b=p.bugs.filter(x=>x.status==='Çözüldü'&&bu(x.done_at)), r=p.releases.filter(x=>bu(x.date));
  const devam=p.todos.filter(x=>x.status==='Devam ediyor');
  if(!g.length&&!b.length&&!r.length) return alertBilgi('Bu hafta henüz biten görev, çözülen bug ya da yeni sürüm yok.');
  const satir=l=>l.map(x=>'• '+x.title).join('\n');
  let m='';
  if(r.length) m+='**🚀 Yeni sürüm'+(r.length>1?'ler':'')+'**\n'+r.map(x=>'• '+dlV(x.version)+(x.title?' — '+x.title:'')).join('\n')+'\n\n';
  if(g.length) m+='**✅ Tamamlananlar**\n'+satir(g.slice(0,12))+(g.length>12?'\n• … ve '+(g.length-12)+' tane daha':'')+'\n\n';
  if(b.length) m+='**🐛 Düzeltilen buglar**\n'+satir(b.slice(0,10))+(b.length>10?'\n• … ve '+(b.length-10)+' tane daha':'')+'\n\n';
  if(devam.length) m+='**🔧 Üzerinde çalışılanlar**\n'+satir(devam.slice(0,6));
  Object.assign(DL.gonderi,{kart:true,baslik:p.project+' · Bu hafta neler oldu?',metin:m.trim()});
  dlSayfaCiz(); tost('Taslak hazır; düzenleyip gönderebilirsin');
}
